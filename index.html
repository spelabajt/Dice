<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Butterfly Sanctuary - Welcome</title>
    <style>
        :root {
            --bright-neon: #f0c3ff; 
            --pastel-purple: #d896ff;
            --blue: #a3e4ff;
            --glass: rgba(0, 0, 0, 0.7);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: url("img/background.jpg") no-repeat center center fixed;
            background-size: cover;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .welcome-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 60px 40px;
            border-radius: 40px;
            border: 2px solid var(--pastel-purple);
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 90%;
            animation: fadeInScale 1s ease-out;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Prilagojen razred za sliko metulja */
        .butterfly-logo {
            width:70px;
            height:70px;
            margin-bottom: 20px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        h1 {
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 8px;
            margin-bottom: 10px;
            font-weight: 900;
            text-shadow: 0 0 20px var(--pastel-purple);
        }

        .btn-enter {
            display: inline-block;
            background: linear-gradient(45deg, #a044ff, #d896ff);
            color: white;
            text-decoration: none;
            padding: 18px 50px;
            border-radius: 50px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 10px 30px rgba(160, 68, 255, 0.4);
            transition: all 0.4s;
        }

        .btn-enter:hover {
            transform: scale(1.1);
            box-shadow: 0 0 40px var(--pastel-purple);
            background: white;
            color: black;
        }
    </style>
</head>
<body>
    <div class="welcome-card">
        <img src="img/butterfly.png" alt="Butterfly" class="butterfly-logo">
        
        <h1>Butterfly</h1>
        <p style="color: var(--blue); margin-bottom: 40px; letter-spacing: 2px;">GAME</p>
        <a href="html/s1.php?reset_session=1" class="btn-enter">Enter</a>
    </div>
</body>
</html>
